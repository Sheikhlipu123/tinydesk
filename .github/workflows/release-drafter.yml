name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '📦 Maintenance'
    labels:
      - 'chore'
      - 'docs'

change-template: '- $TITLE by @$AUTHOR'
template: |
  ## Changes

  $CHANGES
